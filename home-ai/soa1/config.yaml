server:
  host: "0.0.0.0"
  port: 8001

memlayer:
  base_url: "http://localhost:8000"
  user_id: "sachin"
  profile_id: "home"
  top_k: 5

model:
  provider: "ollama"
  base_url: "http://localhost:11434"
  model_name: "NemoAgent:latest"
  temperature: 0.3
  max_tokens: 512
  num_ctx: 32768
  verbose_logging: true

orchestrator:
  model_name: "NemoAgent:latest"
  temperature: 0.3
  max_tokens: 512
  num_ctx: 32768
  # System prompt loaded from prompts/orchestrator.md (model-agnostic)
  # To override: set prompt_file: "path/to/custom.md"

specialists:
  finance:
    enabled: true
    model_name: "phinance-json:latest"
    temperature: 0.05
    system_prompt: |
      Follow the baked-in Analysis Guide. Ensure all calculations are accurate and the output is valid JSON.
      Focus on providing concise, high-value insights for the user's specific spending data.

tts:
  enabled: false
  model: "microsoft/VibeVoice-Realtime-0.5B"
  speaker_id: 0
  output_dir: "/tmp/soa1_tts"
  sample_rate: 24000

