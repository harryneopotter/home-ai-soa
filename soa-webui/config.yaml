# SOA1 Web UI Configuration
# Tailscale Edition

# Server settings
server:
  host: "0.0.0.0"  # Listen on all interfaces for Tailscale
  port: 8080       # Port for web UI

# SOA1 Services
services:
  api: "http://localhost:8001"
  webui: "http://localhost:8080"
  ollama: "http://localhost:11434"

# Tailscale settings
tailscale:
  enabled: true
  # Allow only specific Tailscale IPs (optional)
  allowed_ips:
    - "100.64.0.0/10"  # Tailscale IP range
    - "100.84.92.33"  # Your specific Tailscale IP

# Security
security:
  # IP-based access control
  ip_whitelist:
    - "100.64.0.0/10"
    - "100.84.92.33"
    - "192.168.0.0/16"  # Local Network

# Features
features:
  service_control: true
  monitoring: true
  logging: true
